<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickTag screenshot frame</title>
  <!-- Screenshot 1: a real browser screenshot (screenshot-1-source.webp), framed to Chrome's 1280×800. -->
  <link rel="stylesheet" href="/shot.css">
  <style>
    body { display: grid; place-items: center; }
    .window {
      width: 1216px; border-radius: 10px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
    }
    .window img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="window"><img src="/screenshot-1-source.webp" alt=""></div>
</body>
</html>
